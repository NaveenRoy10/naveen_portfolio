<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fdf2e9"/>
      <stop offset="100%" stop-color="#fde8d8"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fff5ec"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg2)"/>

  <!-- soft decorative circles -->
  <circle cx="90" cy="90" r="70" fill="#ff8a5c" opacity="0.15"/>
  <circle cx="1130" cy="540" r="100" fill="#3d5a80" opacity="0.10"/>
  <circle cx="1100" cy="80" r="40" fill="#ffb37a" opacity="0.25"/>

  <!-- title -->
  <text x="600" y="90" font-family="Verdana, Geneva, sans-serif" font-size="42" font-weight="bold" fill="#2b2b2b" text-anchor="middle">E-Commerce Website</text>
  <text x="600" y="122" font-family="Verdana, Geneva, sans-serif" font-size="18" fill="#7a6a5f" text-anchor="middle">Browse · Cart · Checkout</text>

  <!-- browser window mockup -->
  <rect x="130" y="160" width="940" height="400" rx="16" fill="#ffffff" stroke="#e8ddd2" stroke-width="2"/>
  <rect x="130" y="160" width="940" height="46" rx="16" fill="#f4ebe1"/>
  <rect x="130" y="188" width="940" height="18" fill="#f4ebe1"/>
  <circle cx="160" cy="183" r="7" fill="#ff6b6b"/>
  <circle cx="184" cy="183" r="7" fill="#ffd166"/>
  <circle cx="208" cy="183" r="7" fill="#6bcB77"/>
  <rect x="500" y="172" width="400" height="22" rx="11" fill="#ffffff" stroke="#e0d5c8"/>
  <text x="520" y="188" font-family="Verdana, Geneva, sans-serif" font-size="12" fill="#a99884">shopmarket.com/store</text>

  <!-- nav bar -->
  <rect x="130" y="206" width="940" height="46" fill="#3d5a80"/>
  <text x="160" y="234" font-family="Verdana, Geneva, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">SHOPLY</text>
  <text x="700" y="234" font-family="Verdana, Geneva, sans-serif" font-size="13" fill="#e0e8f0">Home</text>
  <text x="770" y="234" font-family="Verdana, Geneva, sans-serif" font-size="13" fill="#e0e8f0">Shop</text>
  <text x="830" y="234" font-family="Verdana, Geneva, sans-serif" font-size="13" fill="#e0e8f0">Deals</text>
  <!-- cart icon in nav -->
  <g transform="translate(970,214)">
    <path d="M0,4 h6 l4,16 h16 l4,-12 h-22" stroke="#ffffff" stroke-width="2" fill="none" stroke-linejoin="round"/>
    <circle cx="12" cy="26" r="2.4" fill="#ffffff"/>
    <circle cx="24" cy="26" r="2.4" fill="#ffffff"/>
  </g>

  <!-- product cards -->
  <g transform="translate(170,275)">
    <!-- card 1 -->
    <g>
      <rect width="200" height="240" rx="12" fill="url(#cardGrad)" stroke="#eee0d2"/>
      <rect x="16" y="16" width="168" height="120" rx="8" fill="#ffe3cc"/>
      <path d="M60,120 L100,70 L130,100 L160,60" stroke="#ff8a5c" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="150" cy="55" r="10" fill="#ffcf94"/>
      <rect x="16" y="150" width="120" height="12" rx="6" fill="#d9cabb"/>
      <rect x="16" y="170" width="80" height="10" rx="5" fill="#e8ddd0"/>
      <text x="16" y="205" font-family="Verdana, Geneva, sans-serif" font-size="18" font-weight="bold" fill="#ff6b3d">$24.00</text>
      <rect x="16" y="214" width="168" height="14" rx="7" fill="#3d5a80"/>
    </g>
    <!-- card 2 -->
    <g transform="translate(220,0)">
      <rect width="200" height="240" rx="12" fill="url(#cardGrad)" stroke="#eee0d2"/>
      <rect x="16" y="16" width="168" height="120" rx="8" fill="#dcefe6"/>
      <circle cx="100" cy="76" r="34" fill="#8fd6b4"/>
      <rect x="16" y="150" width="120" height="12" rx="6" fill="#d9cabb"/>
      <rect x="16" y="170" width="80" height="10" rx="5" fill="#e8ddd0"/>
      <text x="16" y="205" font-family="Verdana, Geneva, sans-serif" font-size="18" font-weight="bold" fill="#ff6b3d">$39.00</text>
      <rect x="16" y="214" width="168" height="14" rx="7" fill="#3d5a80"/>
    </g>
    <!-- card 3 -->
    <g transform="translate(440,0)">
      <rect width="200" height="240" rx="12" fill="url(#cardGrad)" stroke="#eee0d2"/>
      <rect x="16" y="16" width="168" height="120" rx="8" fill="#f4dcec"/>
      <rect x="60" y="40" width="80" height="80" rx="10" fill="#e29fc9"/>
      <rect x="16" y="150" width="120" height="12" rx="6" fill="#d9cabb"/>
      <rect x="16" y="170" width="80" height="10" rx="5" fill="#e8ddd0"/>
      <text x="16" y="205" font-family="Verdana, Geneva, sans-serif" font-size="18" font-weight="bold" fill="#ff6b3d">$18.50</text>
      <rect x="16" y="214" width="168" height="14" rx="7" fill="#3d5a80"/>
    </g>
    <!-- card 4 -->
    <g transform="translate(660,0)">
      <rect width="200" height="240" rx="12" fill="url(#cardGrad)" stroke="#eee0d2"/>
      <rect x="16" y="16" width="168" height="120" rx="8" fill="#fdeccb"/>
      <polygon points="100,40 130,110 70,110" fill="#f0b95c"/>
      <rect x="16" y="150" width="120" height="12" rx="6" fill="#d9cabb"/>
      <rect x="16" y="170" width="80" height="10" rx="5" fill="#e8ddd0"/>
      <text x="16" y="205" font-family="Verdana, Geneva, sans-serif" font-size="18" font-weight="bold" fill="#ff6b3d">$52.00</text>
      <rect x="16" y="214" width="168" height="14" rx="7" fill="#3d5a80"/>
    </g>
  </g>
</svg>
