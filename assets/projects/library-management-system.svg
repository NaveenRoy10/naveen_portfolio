<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eef2f7"/>
      <stop offset="100%" stop-color="#dfe7f0"/>
    </linearGradient>
    <linearGradient id="woodGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c6b45"/>
      <stop offset="100%" stop-color="#7a4f31"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg3)"/>

  <!-- decorative circles -->
  <circle cx="60" cy="60" r="70" fill="#5c7cad" opacity="0.10"/>
  <circle cx="1150" cy="560" r="90" fill="#c98a4b" opacity="0.12"/>

  <!-- title -->
  <text x="600" y="90" font-family="Verdana, Geneva, sans-serif" font-size="42" font-weight="bold" fill="#2b2b3a" text-anchor="middle">Library Management System</text>
  <text x="600" y="122" font-family="Verdana, Geneva, sans-serif" font-size="18" fill="#5c6b7a" text-anchor="middle">Catalog · Search · Borrow &amp; Return</text>

  <!-- bookshelf frame -->
  <rect x="150" y="330" width="900" height="200" fill="url(#woodGrad)" rx="6"/>
  <rect x="150" y="330" width="900" height="14" fill="#6b4a2e"/>
  <rect x="150" y="516" width="900" height="14" fill="#6b4a2e"/>
  <rect x="150" y="410" width="900" height="10" fill="#6b4a2e" opacity="0.6"/>

  <!-- books row 1 -->
  <g transform="translate(180,345)">
    <rect x="0" y="0" width="26" height="60" fill="#e07a5f"/>
    <rect x="30" y="0" width="20" height="60" fill="#3d5a80"/>
    <rect x="54" y="0" width="30" height="60" fill="#81b29a"/>
    <rect x="88" y="0" width="18" height="60" fill="#f2cc8f"/>
    <rect x="110" y="0" width="24" height="60" fill="#6d597a"/>
    <rect x="138" y="0" width="20" height="60" fill="#e07a5f"/>
    <rect x="162" y="0" width="28" height="60" fill="#3d5a80"/>
    <rect x="194" y="0" width="22" height="60" fill="#81b29a"/>
    <rect x="220" y="0" width="18" height="60" fill="#f2cc8f"/>
    <rect x="242" y="0" width="26" height="60" fill="#6d597a"/>
  </g>
  <!-- leaning book -->
  <g transform="translate(470,368) rotate(-12)">
    <rect x="0" y="0" width="60" height="38" fill="#f4a259"/>
    <rect x="0" y="0" width="60" height="10" fill="#e08a3a"/>
  </g>
  <!-- books row 1 continued -->
  <g transform="translate(560,345)">
    <rect x="0" y="0" width="20" height="60" fill="#3d5a80"/>
    <rect x="24" y="0" width="30" height="60" fill="#e07a5f"/>
    <rect x="58" y="0" width="18" height="60" fill="#81b29a"/>
    <rect x="80" y="0" width="24" height="60" fill="#f2cc8f"/>
    <rect x="108" y="0" width="20" height="60" fill="#6d597a"/>
    <rect x="132" y="0" width="26" height="60" fill="#3d5a80"/>
    <rect x="162" y="0" width="18" height="60" fill="#e07a5f"/>
    <rect x="184" y="0" width="30" height="60" fill="#81b29a"/>
    <rect x="218" y="0" width="20" height="60" fill="#f2cc8f"/>
    <rect x="242" y="0" width="24" height="60" fill="#6d597a"/>
    <rect x="270" y="0" width="18" height="60" fill="#e07a5f"/>
  </g>

  <!-- books row 2 (lower shelf) -->
  <g transform="translate(180,435)">
    <rect x="0" y="0" width="22" height="60" fill="#81b29a"/>
    <rect x="26" y="0" width="18" height="60" fill="#6d597a"/>
    <rect x="48" y="0" width="30" height="60" fill="#f2cc8f"/>
    <rect x="82" y="0" width="20" height="60" fill="#e07a5f"/>
    <rect x="106" y="0" width="26" height="60" fill="#3d5a80"/>
  </g>
  <g transform="translate(430,435)">
    <rect x="0" y="0" width="24" height="60" fill="#f2cc8f"/>
    <rect x="28" y="0" width="20" height="60" fill="#e07a5f"/>
    <rect x="52" y="0" width="30" height="60" fill="#81b29a"/>
    <rect x="86" y="0" width="18" height="60" fill="#3d5a80"/>
    <rect x="108" y="0" width="26" height="60" fill="#6d597a"/>
    <rect x="138" y="0" width="20" height="60" fill="#f2cc8f"/>
  </g>
  <g transform="translate(700,435)">
    <rect x="0" y="0" width="20" height="60" fill="#3d5a80"/>
    <rect x="24" y="0" width="28" height="60" fill="#81b29a"/>
    <rect x="56" y="0" width="18" height="60" fill="#e07a5f"/>
    <rect x="78" y="0" width="24" height="60" fill="#f2cc8f"/>
    <rect x="106" y="0" width="30" height="60" fill="#6d597a"/>
    <rect x="140" y="0" width="20" height="60" fill="#3d5a80"/>
  </g>

  <!-- open book icon floating (catalog/search concept) -->
  <g transform="translate(830,350)">
    <path d="M0,10 C25,-4 55,-4 80,10 L80,80 C55,66 25,66 0,80 Z" fill="#ffffff" stroke="#c9b79c" stroke-width="2"/>
    <path d="M80,10 C105,-4 135,-4 160,10 L160,80 C135,66 105,66 80,80 Z" fill="#ffffff" stroke="#c9b79c" stroke-width="2"/>
    <line x1="80" y1="10" x2="80" y2="80" stroke="#c9b79c" stroke-width="2"/>
    <line x1="14" y1="24" x2="60" y2="24" stroke="#a7b3c2" stroke-width="3"/>
    <line x1="14" y1="38" x2="60" y2="38" stroke="#a7b3c2" stroke-width="3"/>
    <line x1="14" y1="52" x2="55" y2="52" stroke="#a7b3c2" stroke-width="3"/>
    <line x1="100" y1="24" x2="146" y2="24" stroke="#a7b3c2" stroke-width="3"/>
    <line x1="100" y1="38" x2="146" y2="38" stroke="#a7b3c2" stroke-width="3"/>
    <line x1="100" y1="52" x2="140" y2="52" stroke="#a7b3c2" stroke-width="3"/>
  </g>

  <!-- search magnifier badge -->
  <g transform="translate(190,230)">
    <circle cx="0" cy="0" r="26" fill="#3d5a80"/>
    <circle cx="-3" cy="-3" r="10" fill="none" stroke="#ffffff" stroke-width="3"/>
    <line x1="5" y1="5" x2="12" y2="12" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- library card / ID badge -->
  <g transform="translate(940,190)">
    <rect x="-60" y="-38" width="120" height="76" rx="10" fill="#ffffff" stroke="#c9b79c" stroke-width="2"/>
    <circle cx="-30" cy="-8" r="14" fill="#c9d7ea"/>
    <rect x="-8" y="-16" width="52" height="8" rx="4" fill="#c9d7ea"/>
    <rect x="-8" y="-2" width="40" height="6" rx="3" fill="#dfe7f0"/>
    <rect x="-45" y="16" width="90" height="8" rx="4" fill="#e8ddd0"/>
  </g>
</svg>
