<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ocean" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a4f6b"/>
      <stop offset="55%" stop-color="#0f7a9c"/>
      <stop offset="100%" stop-color="#0b2f4a"/>
    </linearGradient>
    <linearGradient id="sunbeam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8fe3f0" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#8fe3f0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="coralGrad1" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#ff7a59"/>
      <stop offset="100%" stop-color="#ffb199"/>
    </linearGradient>
    <linearGradient id="coralGrad2" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#ff9f6b"/>
      <stop offset="100%" stop-color="#ffd39c"/>
    </linearGradient>
    <linearGradient id="coralGrad3" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#5ee6c8"/>
      <stop offset="100%" stop-color="#a4f5e0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#ocean)"/>
  <polygon points="0,0 400,0 150,630 0,630" fill="url(#sunbeam)"/>
  <polygon points="500,0 900,0 700,630 400,630" fill="url(#sunbeam)" opacity="0.6"/>

  <!-- bubbles -->
  <g fill="#bff2ff" opacity="0.5">
    <circle cx="150" cy="110" r="6"/>
    <circle cx="180" cy="150" r="4"/>
    <circle cx="1080" cy="90" r="7"/>
    <circle cx="1050" cy="140" r="4"/>
    <circle cx="980" cy="60" r="3"/>
    <circle cx="300" cy="70" r="3"/>
  </g>

  <!-- sea floor -->
  <path d="M0,560 Q300,520 600,555 T1200,545 L1200,630 L0,630 Z" fill="#083a52"/>

  <!-- coral branches -->
  <g stroke="url(#coralGrad1)" stroke-width="14" stroke-linecap="round" fill="none">
    <path d="M180,560 C180,500 140,470 150,420"/>
    <path d="M180,560 C180,500 210,460 200,410"/>
    <path d="M180,560 C185,510 190,480 230,440"/>
  </g>
  <g stroke="url(#coralGrad2)" stroke-width="10" stroke-linecap="round" fill="none">
    <path d="M980,570 C980,520 950,500 955,460"/>
    <path d="M980,570 C980,520 1010,500 1015,455"/>
    <path d="M980,570 C985,530 1000,510 1030,480"/>
  </g>
  <!-- brain coral mound -->
  <ellipse cx="600" cy="580" rx="90" ry="42" fill="url(#coralGrad3)"/>
  <g stroke="#2fae8f" stroke-width="3" fill="none" opacity="0.6">
    <path d="M530,575 q20,-18 40,0 q20,-18 40,0 q20,-18 40,0"/>
    <path d="M525,590 q20,-16 40,0 q20,-16 40,0 q20,-16 40,0 q20,-16 40,0"/>
  </g>

  <!-- small fan coral -->
  <path d="M330,590 C300,540 300,500 340,470 C380,500 380,540 350,590 Z" fill="url(#coralGrad2)" opacity="0.9"/>
  <path d="M900,590 C880,555 880,525 905,505 C935,525 935,555 915,590 Z" fill="url(#coralGrad1)" opacity="0.9"/>

  <!-- fish -->
  <g transform="translate(760,220)">
    <path d="M0,0 C30,-20 60,-20 80,0 C60,20 30,20 0,0 Z" fill="#ffd166"/>
    <polygon points="0,0 -18,-14 -18,14" fill="#ffd166"/>
    <circle cx="60" cy="-3" r="3" fill="#0b2f4a"/>
  </g>
  <g transform="translate(300,300) scale(0.7)">
    <path d="M0,0 C30,-20 60,-20 80,0 C60,20 30,20 0,0 Z" fill="#7fe0d0"/>
    <polygon points="0,0 -18,-14 -18,14" fill="#7fe0d0"/>
    <circle cx="60" cy="-3" r="3" fill="#0b2f4a"/>
  </g>

  <!-- sensor / monitoring node above reef -->
  <g transform="translate(600,250)">
    <circle cx="0" cy="0" r="34" fill="#ffffff" opacity="0.12"/>
    <circle cx="0" cy="0" r="24" fill="#ffffff" opacity="0.9"/>
    <path d="M-10,4 L-4,-6 L2,2 L8,-8 L14,0" stroke="#0f7a9c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M-6,-16 a18,18 0 0 1 12,0" stroke="#ffffff" stroke-width="3" fill="none" opacity="0.85"/>
    <line x1="0" y1="24" x2="0" y2="70" stroke="#ffffff" stroke-width="3" opacity="0.6"/>
  </g>

  <!-- heartbeat / health line stretching across -->
  <path d="M60,470 L260,470 L290,430 L320,510 L350,460 L400,470 L980,470"
        fill="none" stroke="#7ee8d6" stroke-width="4" opacity="0.75" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- title -->
  <text x="600" y="130" font-family="Verdana, Geneva, sans-serif" font-size="46" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="1">Coral Health Monitoring System</text>
  <text x="600" y="170" font-family="Verdana, Geneva, sans-serif" font-size="20" fill="#bff2ff" text-anchor="middle" opacity="0.9">Real-time reef vitals · Sensor data · Ecosystem insights</text>
</svg>
